# Doc2FAQ Application Configuration

# Application name
spring.application.name=doc2faq

# Server port (default 8080)
server.port=8080

# ---- Multipart / File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- AWS S3 ----
app.s3.bucket-name=bucket-name-2346456765
app.s3.region=us-east-1

# ---- Allowed upload extensions ----
app.upload.allowed-extensions=pdf,docx,txt
app.upload.max-size-bytes=10485760
